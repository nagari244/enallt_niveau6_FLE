/* =========================================================
   Moteur
   ========================================================= */
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const nav = document.getElementById('tabs');
const panels = document.getElementById('panels');
const Q = {}; // clé → question

function renderQ(q, key) {
  Q[key] = q;
  if (q.type === 'head') return `<h4 class="text-base font-bold text-unam-blue border-b-2 border-unam-gold pb-1 pt-2">${esc(q.q)}</h4>`;
  let body = '';
  if (q.type === 'radio' || q.type === 'check') {
    const t = q.type === 'radio' ? 'radio' : 'checkbox';
    body = q.options.map((o, k) => `
      <label class="flex items-start gap-3 p-3 sm:p-2 rounded-md cursor-pointer hover:bg-gray-50 active:bg-gray-100">
        <input type="${t}" name="${key}" value="${k}" class="mt-0.5 h-5 w-5 sm:h-4 sm:w-4 shrink-0">
        <span class="text-sm">${esc(o)}</span>
      </label>`).join('');
  } else if (q.type === 'tf') {
    body = `<div class="flex gap-3">${['Vrai', 'Faux'].map((o, k) => `
      <label class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-3 sm:py-2 rounded-md border border-gray-300 cursor-pointer hover:bg-gray-50 active:bg-gray-100">
        <input type="radio" name="${key}" value="${k === 0}" class="h-5 w-5 sm:h-4 sm:w-4"><span class="text-sm font-semibold">${o}</span>
      </label>`).join('')}</div>`;
  } else if (q.type === 'match') {
    const order = q.ordered ? q.choices.map((_, j) => j) : shuffle(q.choices.map((_, j) => j));
    body = q.items.map((it, k) => `
      <div class="grid sm:grid-cols-2 gap-1.5 sm:gap-3 items-center py-2.5 sm:py-1.5 border-b border-gray-100 last:border-0">
        <span class="text-sm font-semibold">${esc(it[0])}</span>
        <select name="${key}_${k}" class="w-full text-base sm:text-sm border border-gray-300 rounded-md px-3 py-2.5 sm:py-2 bg-white">
          <option value="">— choisir —</option>
          ${order.map(j => `<option value="${j}">${esc(q.choices[j])}</option>`).join('')}
        </select>
      </div>`).join('');
  } else if (q.type === 'open') {
    body = `<p class="inline-flex items-center gap-2 text-sm font-semibold text-unam-blue bg-unam-soft border border-gray-200 rounded-full px-3 py-1.5">&#9998; ${esc(q.where || 'Sur papier')}</p>` +
      (q.model ? `<div><button type="button" class="show-model mt-3 text-xs font-semibold text-unam-blue underline">Voir une proposition</button>
        <div class="model hidden mt-2 p-3 rounded bg-ok-light text-sm border border-ok">${esc(q.model)}</div></div>` : '');
  }
  return `
    <fieldset class="bg-white p-4 sm:p-5 rounded-lg border border-gray-300 q" data-key="${key}" ${q.type !== 'open' ? 'data-scored="1"' : ''}>
      <p class="text-base font-bold mb-3 leading-snug">${esc(q.q)}</p>
      <div class="space-y-1">${body}</div>
      <div class="feedback hidden mt-3 p-3 rounded text-sm"></div>
    </fieldset>`;
}

function renderCards(cards) {
  return `<div class="grid sm:grid-cols-2 gap-3">${cards.map(([t, txt]) => `
    <div class="rounded-lg border border-gray-200 bg-unam-soft p-4">
      <h5 class="font-bold text-unam-blue mb-1">${esc(t)}</h5>
      <p class="text-sm leading-relaxed">${txt}</p>
    </div>`).join('')}</div>`;
}

const stopAt = {};
document.querySelectorAll('video').forEach(v => v.addEventListener('timeupdate', () => {

/* ---------- Correction ---------- */
function check(fs) {
  const key = fs.dataset.key, q = Q[key];
  let pts = 0, max = 1, detail = '';
  if (q.type === 'radio') {
    const sel = fs.querySelector(`input[name="${key}"]:checked`);
    pts = sel && +sel.value === q.answer ? 1 : 0;
    if (!pts) detail = `Bonne réponse : <b>${esc(q.options[q.answer])}</b>`;
  } else if (q.type === 'tf') {
    const sel = fs.querySelector(`input[name="${key}"]:checked`);
    pts = sel && (sel.value === 'true') === q.answer ? 1 : 0;
    if (!pts) detail = `Bonne réponse : <b>${q.answer ? 'Vrai' : 'Faux'}</b>`;
  } else if (q.type === 'check') {
    const sel = [...fs.querySelectorAll(`input[name="${key}"]:checked`)].map(i => +i.value).sort();
    const tgt = [...q.answer].sort();
    pts = sel.length === tgt.length && sel.every((v, i) => v === tgt[i]) ? 1 : 0;
    if (!pts) detail = `Bonnes réponses : ${tgt.map(i => '<b>' + esc(q.options[i]) + '</b>').join(' · ')}`;
  } else if (q.type === 'match') {
    max = q.items.length; const wrong = [];
    q.items.forEach((it, k) => {
      const s = fs.querySelector(`select[name="${key}_${k}"]`);
      const good = s.value !== '' && +s.value === it[1];
      s.classList.remove('border-gray-300', 'border-ok', 'border-alert');
      s.classList.add('border-2', good ? 'border-ok' : 'border-alert');
      if (good) pts++; else wrong.push(`${esc(it[0])} → <b>${esc(q.choices[it[1]])}</b>`);
    });
    if (wrong.length) detail = 'Corrections : ' + wrong.join(' · ');
  }
  const full = pts === max, fb = fs.querySelector('.feedback');
  fs.classList.remove('border-gray-300', 'border-ok', 'border-alert');
  fs.classList.add('border-2', full ? 'border-ok' : 'border-alert');
  fb.className = 'feedback mt-3 p-3 rounded text-sm ' + (full ? 'bg-ok-light text-blue-900' : 'bg-alert-light text-red-900');
  fb.innerHTML = `<strong>${full ? 'Bonne réponse.' : (max > 1 ? `${pts} / ${max}.` : 'Réponse incorrecte ou incomplète.')}</strong>` +
    (detail ? `<span class="block mt-1">${detail}</span>` : '') + (q.reason ? `<span class="block text-xs mt-1 text-gray-700">${esc(q.reason)}</span>` : '');
  return [pts, max];
}

document.addEventListener('click', e => {
  const b = e.target.closest('.btn-check');
  if (b) {
    const sec = b.dataset.sec, root = document.getElementById('step_' + sec);
    let pts = 0, max = 0;
    root.querySelectorAll('fieldset[data-scored]').forEach(fs => { const [p, m] = check(fs); pts += p; max += m; });
    const box = document.getElementById('score_' + sec), r = pts / max;
    box.querySelector('.score-badge').textContent = `${pts} / ${max}`;
    let txt = r >= 0.8 ? 'Excellent ! Vous avez bien compris.' : r >= 0.5 ? 'Résultat satisfaisant. Lisez les justifications et réécoutez les passages difficiles.' : 'Réécoutez la vidéo partie par partie en vous aidant des justifications.';
    const [tab, step] = sec.split('_');
    if (step === 'det') { document.getElementById('tr_' + tab).classList.remove('hidden'); txt += ' La transcription est maintenant disponible en bas de la page.'; }
    box.querySelector('.score-text').textContent = txt;
    box.classList.remove('hidden');
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  const r = e.target.closest('.btn-reset');
  if (r) {
    const root = document.getElementById('step_' + r.dataset.sec);
    root.querySelectorAll('input').forEach(i => i.checked = false);
    root.querySelectorAll('select').forEach(s => { s.value = ''; s.classList.remove('border-ok', 'border-alert', 'border-2'); s.classList.add('border-gray-300'); });
    root.querySelectorAll('.feedback, .score, .model').forEach(x => x.classList.add('hidden'));
    root.querySelectorAll('fieldset').forEach(fs => { fs.classList.remove('border-ok', 'border-alert', 'border-2'); fs.classList.add('border-gray-300'); });
  }
});

showTab('v1');
</script>
</body>
</html>
