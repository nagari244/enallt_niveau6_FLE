<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>À ou DE ? Pronoms et impératif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#102a43; --blue:#0066a6; --blue-soft:#e3f0f8; --yellow:#f6c945; --yellow-soft:#fdf3cf;
    --wine:#7d1f35; --wine-soft:#f8e4e8; --paper:#ffffff; --muted:#52606d; --line:#d9dee4;
    --ok:#157345; --ok-bg:#ddf2e5; --ko:#a12a35; --ko-bg:#fde3e0;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#fff;color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55}
  button{font:inherit;color:inherit}
  .frame{max-width:980px;margin:0 auto;padding:16px 16px 60px}
  .back{display:inline-block;font-size:.9rem;font-weight:700;color:var(--blue);text-decoration:none;margin-bottom:8px}

  /* En-tête */
  .topbar{border-bottom:3px solid var(--ink);padding-bottom:14px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end}
  .brand{display:flex;align-items:center;gap:12px}
  .dots{width:14px;height:14px;border-radius:50%;background:var(--wine);box-shadow:20px 0 0 var(--yellow),40px 0 0 var(--blue);margin-right:40px;flex:0 0 auto}
  .kicker{margin:0;text-transform:uppercase;letter-spacing:.13em;font-weight:700;font-size:.78rem}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;letter-spacing:-.02em;line-height:1.1}
  h1{margin:10px 0 0;font-size:clamp(1.7rem,5vw,2.6rem)}
  .status{min-width:190px;flex:1 1 190px;max-width:320px}
  .status .row{display:flex;justify-content:space-between;font-weight:700;font-size:.88rem;margin-bottom:6px}
  .track{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--wine);border-radius:inherit;transition:width .4s ease}

  /* Écrans */
  .screen{display:none;animation:rise .35s ease both}
  .screen.active{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .card{border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);background:var(--paper);padding:clamp(18px,4vw,36px);margin-top:26px}
  .card.hero{background:var(--blue);color:#fff}
  .card.lesson{background:#fff}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;text-transform:uppercase;font-size:.75rem;font-weight:700;letter-spacing:.12em;margin:0}
  .eyebrow::before{content:"";width:26px;height:4px;background:currentColor;display:block}
  .card h2{margin:12px 0 10px;font-size:clamp(1.4rem,4vw,2rem)}
  .lead{font-size:1.05rem;margin:4px 0 14px}

  /* Accueil : choix du parcours */
  .modules{display:grid;grid-template-columns:1fr;gap:16px;margin-top:22px}
  @media(min-width:720px){.modules{grid-template-columns:1fr 1fr}}
  .module{border:3px solid var(--ink);background:#fff;color:var(--ink);padding:18px;text-align:left;cursor:pointer;box-shadow:5px 5px 0 var(--yellow);transition:transform .15s,box-shadow .15s}
  .module:hover,.module:focus-visible{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--yellow);outline:none}
  .module .tag{display:inline-block;font-weight:700;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border:2px solid var(--ink);margin-bottom:8px}
  .module h3{margin:4px 0 6px;font-size:1.35rem}
  .module p{margin:0;color:var(--muted);font-size:.95rem}
  .module .done{display:block;margin-top:8px;font-weight:700;color:var(--ok)}

  /* Éléments de leçon */
  .pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
  .pill{border:2px solid var(--ink);padding:6px 11px;font-weight:600;font-size:.92rem;background:#fff}
  .pill.cod{background:var(--blue-soft);border-color:var(--blue)}
  .pill.coi{background:var(--wine-soft);border-color:var(--wine)}
  .pill.de{background:var(--yellow-soft);border-color:#b48a14}
  .two{display:grid;grid-template-columns:1fr;gap:14px;margin:12px 0}
  @media(min-width:680px){.two{grid-template-columns:1fr 1fr}}
  .panel{border:2px solid var(--ink);padding:14px 16px}
  .panel.cod{background:var(--blue-soft);border-color:var(--blue)}
  .panel.coi{background:var(--wine-soft);border-color:var(--wine)}
  .panel.de{background:var(--yellow-soft);border-color:#b48a14}
  .panel h4{margin:0 0 6px;font-size:1.02rem}
  .panel p{margin:4px 0}
  .ex{margin:6px 0;font-size:1.02rem}
  .ex b{white-space:nowrap}
  .arrow{color:var(--muted);margin:0 6px}
  .c-cod{color:var(--blue);font-weight:700}
  .c-coi{color:var(--wine);font-weight:700}
  .c-de{color:#8a6a0c;font-weight:700}
  .tip{border-left:6px solid var(--yellow);background:var(--yellow-soft);padding:10px 14px;margin:14px 0 0;font-weight:500}
  table.rules{border-collapse:collapse;width:100%;margin:10px 0;font-size:.97rem}
  table.rules th,table.rules td{border:2px solid var(--ink);padding:8px 10px;text-align:left;vertical-align:top}
  table.rules th{background:var(--yellow-soft)}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* Quiz */
  .qcount{font-weight:700;color:var(--wine)}
  .prompt{font-size:clamp(1.15rem,3.5vw,1.45rem);font-weight:700;margin:6px 0 4px}
  .help{color:var(--muted);margin:0 0 6px}
  .choices{display:grid;gap:12px;margin-top:18px}
  .choices.grid{grid-template-columns:1fr 1fr}
  @media(min-width:700px){.choices.grid{grid-template-columns:repeat(3,1fr)}}
  .choice{display:flex;gap:12px;align-items:center;min-height:58px;border:2px solid var(--ink);background:#fff;padding:12px 14px;text-align:left;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
  .choice:hover:not(:disabled),.choice:focus-visible:not(:disabled){transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--yellow);outline:none}
  .choice:disabled{cursor:default}
  .choice .l{flex:0 0 auto;display:grid;place-items:center;min-width:30px;height:30px;padding:0 6px;background:var(--ink);color:#fff;border-radius:999px;font-size:.85rem;font-weight:700}
  .choice.correct{background:var(--ok-bg);border-color:var(--ok)}
  .choice.correct .l{background:var(--ok)}
  .choice.wrong{background:var(--ko-bg);border-color:var(--ko)}
  .choice.wrong .l{background:var(--ko)}
  .feedback{display:none;margin-top:18px;padding:13px 16px;border-left:7px solid var(--ko);background:var(--ko-bg);font-weight:600}
  .feedback.show{display:block;animation:rise .25s ease both}
  .feedback.good{border-color:var(--ok);background:var(--ok-bg)}
  .nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:20px}
  .btn{border:2px solid var(--ink);background:var(--yellow);color:var(--ink);padding:12px 18px;min-height:50px;font-weight:700;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
  .btn:hover:not(:disabled),.btn:focus-visible{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);outline:none}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:#fff}
  .linkbtn{background:none;border:0;padding:6px 0;font-weight:700;color:var(--blue);cursor:pointer;text-decoration:underline}

  /* Animation d'erreur */
  .shake{animation:shake .45s ease}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  .flash{position:fixed;inset:0;pointer-events:none;background:rgba(161,42,53,.14);opacity:0;z-index:40}
  .flash.on{animation:flash .5s ease}
  @keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
  .pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);font-family:"Fraunces",serif;font-size:3.2rem;font-weight:700;pointer-events:none;opacity:0;z-index:41}
  .pop.ok{color:var(--ok)} .pop.ko{color:var(--ko)}
  .pop.on{animation:pop .8s ease}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

  /* Résultats */
  .score-big{font-family:"Fraunces",serif;font-size:clamp(3.5rem,12vw,6.5rem);color:var(--yellow);line-height:.95;margin:16px 0}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  /* ===== Parcours 3 : le jeu des doubles pronoms ===== */
  .module.wide{grid-column:1/-1}
  .pk-v{color:#8a32b4;font-weight:700} .pk-g{color:#33802a;font-weight:700} .pk-r{color:#c43a31;font-weight:700} .pk-b{color:#0a7489;font-weight:700}
  .card.gamecard{padding:clamp(12px,3vw,32px)}
  .gtitle{color:#4253d6;text-align:center;margin:4px 0 14px!important;font-size:clamp(1.55rem,5vw,2.4rem)!important}

  /* Formules */
  .gform{border:2px solid var(--ink);margin:0 0 18px}
  .gform summary{cursor:pointer;font-weight:700;padding:12px 16px;background:#f5f6ff;list-style-position:inside}
  .fgrid{display:grid;grid-template-columns:1fr;gap:14px;padding:14px}
  @media(min-width:760px){.fgrid{grid-template-columns:1fr 1fr}}
  .fbox{border:2px solid var(--line);border-radius:12px;padding:14px 14px 12px;background:#fff}
  .fbox.wide{grid-column:1/-1}
  .fbox h4{margin:0 0 2px;font-size:1rem}
  .fbox .fsub{margin:0 0 6px;color:var(--muted);font-size:.88rem}
  .fex{margin:8px 0 0;font-size:.98rem}
  .fnote{margin:8px 0 0;font-size:.9rem;color:var(--muted)}
  .circles{display:flex;align-items:center;justify-content:center;margin:12px 0 4px;padding-right:10px}
  .circ{width:clamp(90px,25vw,132px);aspect-ratio:1;border-radius:50%;border:3px solid;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:700;line-height:1.3;position:relative;font-size:clamp(.9rem,2.8vw,1.05rem)}
  .circ+.circ{margin-left:-14px}
  .circ.v{background:#f4e6fa;border-color:#8a32b4;color:#73279a;z-index:3}
  .circ.g{background:#e7f4e2;border-color:#33802a;color:#2b6c23;z-index:2}
  .circ.r{background:#ffe5e1;border-color:#c43a31;color:#a72f27;z-index:1}
  .circ.v::after,.circ.g::after{content:"";position:absolute;right:-17px;top:50%;transform:translateY(-50%);border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:15px solid currentColor}
  .f2wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 4px}
  .vpill{border:3px solid #8a32b4;background:#faf3fd;border-radius:34px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:center;max-width:215px;font-weight:700}
  .bubble{background:#e0f3f7;border:3px solid #0a7489;color:#075c6c;border-radius:26px 26px 26px 6px;padding:10px 20px;font-family:"Fraunces",Georgia,serif;font-size:1.6rem;font-weight:700;white-space:nowrap}
  .chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 2px}
  .slot{border:2px solid;border-radius:10px;padding:6px 10px;font-weight:700;background:#fff;line-height:1.3}
  .slot.verb{border-color:var(--ink);background:#fdf3cf}
  .slot.v{border-color:#8a32b4;color:#73279a;background:#faf3fd}
  .slot.g{border-color:#33802a;color:#2b6c23;background:#f3faf0}
  .slot.r{border-color:#c43a31;color:#a72f27;background:#fff3f1}
  .slot.b{border-color:#0a7489;color:#075c6c;background:#eef9fb}
  .slot.mix{border-color:var(--ink)}
  .arr{font-weight:700;color:var(--muted)}
  .chain.mini{gap:4px;margin:4px 0 0}
  .chain.mini .slot{padding:2px 7px;font-size:.86rem;border-radius:8px}
  .fmlab{margin:12px 0 0;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  /* Consigne */
  .gcons{margin:0 0 14px;font-size:1rem}
  .gcons p{margin:4px 0}
  .ib{display:inline-block;width:20px;height:20px;vertical-align:-4px}

  /* Dés et pion */
  .gplay{display:grid;grid-template-columns:1fr;gap:14px;border:2px solid var(--ink);padding:14px;background:#fff}
  @media(min-width:760px){.gplay{grid-template-columns:auto 1fr;align-items:center;gap:24px}}
  .dicebar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:14px 18px}
  .diewrap{text-align:center}
  .dielab{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
  .die{width:70px;height:70px;border:3px solid var(--ink);border-radius:14px;background:#fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;box-shadow:4px 4px 0 var(--ink)}
  .die i,.mdie i{border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
  .die i{width:12px;height:12px}
  .die i.on,.mdie i.on{visibility:visible}
  .die.rolling{animation:tumble .7s ease}
  @keyframes tumble{0%{transform:none}25%{transform:rotate(-20deg) translateY(-8px)}50%{transform:rotate(15deg)}75%{transform:rotate(-8deg) translateY(-3px)}100%{transform:none}}
  .rollbtn{min-width:170px}
  .ptrack .ptop{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:.92rem}
  .prail{position:relative;margin:34px 12px 4px}
  .pcells{display:grid;grid-template-columns:repeat(36,1fr);gap:2px}
  .pcells span{height:14px;background:#e4e7eb;border-radius:3px}
  .pcells span:nth-child(6n){margin-right:3px}
  .pcells span.on{background:#4253d6}
  .pawn{position:absolute;bottom:13px;width:24px;height:32px;transform:translateX(-50%);transition:left .7s cubic-bezier(.3,1.5,.6,1)}
  .pawn svg{width:100%;height:100%;display:block;filter:drop-shadow(1px 2px 0 rgba(16,42,67,.35))}
  .pends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin:0 2px}

  /* Carte tirée */
  .gpanel{border:3px solid var(--ink);box-shadow:6px 6px 0 #4253d6;background:#fff;padding:clamp(14px,3vw,24px);margin:18px 0 6px;scroll-margin-top:12px}
  .gpanel.empty{box-shadow:none;border-style:dashed;color:var(--muted);text-align:center}
  .ghead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
  .gpos{font-weight:700;font-size:.85rem;color:var(--muted)}
  .gtag{font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border:2px solid var(--ink)}
  .gtag.i{background:#e6f8fb;border-color:#14899a}
  .gtag.m{background:#fff0ee;border-color:#c43a31}
  .gsmall{margin:0;font-size:.85rem;font-weight:600;color:var(--muted)}
  .gprompt{font-size:clamp(1.2rem,3.8vw,1.6rem);font-weight:700;line-height:1.35;margin:4px 0 8px}
  .gconsigne{margin:0 0 6px}
  .gdonenote{margin:0 0 10px;padding:8px 12px;background:var(--ok-bg);border-left:6px solid var(--ok);font-weight:600}
  .greveal{border-left:7px solid #4253d6;background:#f4f5ff;padding:12px 16px;margin-top:14px}
  .greveal .glabel{margin:0;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#4253d6}
  .gans{font-size:clamp(1.12rem,3.4vw,1.35rem);font-weight:700;margin:4px 0 6px}
  .galt{margin:4px 0}
  .gnote{margin:8px 0 0;font-size:.95rem;color:#3e4c59}
  .gjudge{display:flex;flex-wrap:wrap;gap:12px}
  .gmsg{margin:12px 0 0;font-weight:600}
  .mm-pool,.mm-line{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:8px;border:2px dashed var(--line);margin-top:8px;align-items:center}
  .mm-line{border-color:#4253d6;background:#fafaff}
  .mm-lab{margin:12px 0 0;font-size:.85rem;font-weight:700;color:var(--muted)}
  .chip{border:2px solid var(--ink);background:#fff;padding:8px 12px;min-height:44px;font-weight:700;letter-spacing:.04em;cursor:pointer}
  .chip:disabled{opacity:.22;cursor:default}
  .mm-act{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap}

  /* Plateau */
  .gboard{display:grid;grid-template-columns:minmax(0,.78fr) repeat(6,minmax(0,1fr));gap:6px;margin-top:16px}
  .gcell{position:relative;border:2px solid #f2a79d;border-radius:12px;background:#fff;padding:8px 5px 20px;min-height:112px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:13px;line-height:1.25;font-weight:500;cursor:pointer;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word;transition:transform .12s,box-shadow .12s}
  .gcell.m{background:#fff4f2}
  .gcell.i{background:#e9fafd;border:3px solid #14899a}
  .gcell.h{cursor:default;padding:6px;background:#fff}
  .gcell:not(.h):hover,.gcell:not(.h):focus-visible{transform:translateY(-2px);box-shadow:0 4px 0 #f2a79d;outline:none}
  .gcell.sel{outline:4px solid #4253d6;outline-offset:2px;z-index:2}
  .gcell.h.hl{border-color:#4253d6;background:#eef0ff}
  .gcell.rev{border-style:dashed;border-color:#b07a0e}
  .gcell.done .gtxt,.gcell.done .glab,.gcell.done .gicon{opacity:.38}
  .gdone{display:none;position:absolute;left:4px;top:3px;font-weight:700;color:var(--ok);font-size:15px}
  .gcell.done .gdone{display:block}
  .glab{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:2px}
  .glab.mm{font-size:13px;color:#c43a31;font-weight:700}
  .gb{position:absolute;right:4px;bottom:4px;width:18px;height:18px}
  .gicon{display:none;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:1.25rem;line-height:1}
  .gcell.i .gicon{color:#0f6f7d} .gcell.m .gicon{color:#c43a31}
  .gpawn{display:none;position:absolute;right:3px;top:3px;width:15px;height:20px}
  .gcell.sel .gpawn{display:block}
  .mdie{width:72%;max-width:62px;aspect-ratio:1;border:2px solid #111;border-radius:13%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9%}
  .mdie i{width:64%;aspect-ratio:1}
  .gcorner svg{width:78%;max-width:66px}
  .glegend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;font-size:.88rem;color:var(--muted)}
  .glegend b{font-family:"Fraunces",Georgia,serif;color:var(--ink)}
  .gfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;margin-top:18px}
  @media(max-width:899px){
    .gcell{font-size:11.5px;min-height:98px;padding:6px 3px 17px;border-radius:10px}
    .glab{font-size:9px} .glab.mm{font-size:11px} .gb{width:15px;height:15px;right:3px;bottom:3px}
  }
  @media(max-width:520px){
    .fgrid{padding:8px;gap:10px} .fbox{padding:12px 10px 10px}
    .circ{width:35%;max-width:124px;font-size:.8rem;line-height:1.1}
    .circ+.circ{margin-left:-10px}
    .f2wrap{flex-direction:column;gap:6px} .f2wrap .arr{transform:rotate(90deg)}
  }
  @media(max-width:639px){
    .gboard{gap:4px;grid-template-columns:repeat(7,minmax(0,1fr))}
    .gcell{min-height:0;aspect-ratio:1;padding:2px;border-radius:8px}
    .gcell.i{border-width:2px}
    .gtxt,.glab{display:none}
    .gicon{display:block}
    .gb{width:12px;height:12px;right:2px;bottom:2px}
    .gdone{font-size:11px;left:3px;top:1px}
    .gpawn{width:11px;height:14px;right:2px;top:2px}
    .mdie{width:74%;border-width:1.5px}
    .die{width:62px;height:62px;padding:8px} .die i{width:10px;height:10px}
  }
  footer{max-width:980px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="flash" id="flash" aria-hidden="true"></div>
<div class="pop" id="pop" aria-hidden="true"></div>

<div class="frame">
  <a class="back" href="index.html">← Matériel didactique</a>
  <header class="topbar">
    <div>

  var MOD_A={id:"a",tag:"Parcours 1",title:"Avec « à » : le, la ou lui ?",desc:"Les verbes de communication et d'échange, les pièges COD/COI et l'impératif.",color:"var(--wine)",steps:[
    {t:"lesson",eyebrow:"Leçon 1",title:"COD ou COI : la question à se poser",html:
      '<div class="two"><div class="panel cod"><h4>COD : verbe + quelqu\'un</h4><p class="ex">J\'écoute Aya.<span class="arrow">→</span><b class="c-cod">Je l\'écoute.</b></p><p>Pronoms : <b>le, la, l\', les</b></p></div>'+
      '<div class="panel coi"><h4>COI : verbe + à + quelqu\'un</h4><p class="ex">Je parle à Aya.<span class="arrow">→</span><b class="c-coi">Je lui parle.</b></p><p>Pronoms : <b>lui, leur</b></p></div></div>'+
      '<p class="tip">Le test : peut-on dire « à quelqu\'un » après le verbe ? Oui → <b>lui, leur</b>. Non → <b>le, la, les</b>.</p>'},
    {t:"quiz",kind:"intrus",q:"Quel verbe de cette liste n'utilise pas « à » ?",help:"Cinq verbes se construisent avec « à quelqu'un ». Trouvez l'intrus !",o:["téléphoner","sourire","aider","plaire","obéir","mentir"],r:2,

    {t:"quiz",kind:"vf",q:"Qu'en dites-vous ? « Je lui appelle ce soir. »",o:["La phrase est correcte.","La phrase est incorrecte."],r:1,
     good:"Bien vu ! On appelle quelqu'un : « Je l'appelle ce soir ».",bad:"Attention : on appelle quelqu'un (COD). On dit « Je l'appelle ce soir »."},

    {t:"lesson",eyebrow:"Leçon 2",title:"Quelque chose à quelqu'un : la double construction",html:
      '<p class="lead">verbe + <span class="c-cod">quelque chose</span> (COD) + à + <span class="c-coi">quelqu\'un</span> (COI)</p>'+
      '<div class="pill-row">'+["dire","demander","donner","envoyer","écrire","expliquer","montrer","raconter","répondre","prêter","rendre","offrir","promettre","conseiller","annoncer","proposer"].map(function(v){return '<span class="pill">'+v+'</span>';}).join("")+'</div>'+
      '<p class="ex">Aya dit <span class="c-cod">la vérité</span> à <span class="c-coi">ses amies</span>.<span class="arrow">→</span><b>Elle <span class="c-cod">la</span> <span class="c-coi">leur</span> dit.</b></p>'+
      '<p class="ex">Elle montre <span class="c-cod">les messages</span> à <span class="c-coi">la police</span>.<span class="arrow">→</span><b>Elle <span class="c-cod">les</span> <span class="c-coi">lui</span> montre.</b></p>'+
      '<p class="tip">Dans la phrase : <b>le, la, les</b> avant <b>lui, leur</b>.</p>'},
    {t:"quiz",kind:"intrus",q:"Quel verbe de cette liste n'utilise pas « à quelqu'un » ?",help:"Cinq verbes : quelque chose à quelqu'un. Un seul est différent.",o:["dire","montrer","envoyer","écouter","raconter","prêter"],r:3,
     good:"Oui ! On écoute quelqu'un ou quelque chose, sans « à ».",bad:"L'intrus est « écouter » : on écoute quelqu'un, sans « à ». → Je l'écoute."},
    {t:"quiz",kind:"qcm",q:"Aya montre les messages à la police. → Aya ___ montre.",o:["les lui","lui les","leur les"],r:0,
     good:"Parfait ! Le COD (les) avant le COI (lui).",bad:"Ordre : le, la, les AVANT lui, leur. → Aya les lui montre."},
    {t:"quiz",kind:"qcm",q:"Tes amies veulent la vérité ? Dis-___ !",o:["la-leur","leur-la","les-leur"],r:0,
     good:"Excellent ! À l'impératif aussi : COD puis COI. → Dis-la-leur !",bad:"La vérité = la ; tes amies = leur. COD puis COI : Dis-la-leur !"},

    {t:"lesson",eyebrow:"Leçon 3",title:"Seulement « à quelqu'un » : les verbes à COI",html:
      '<div class="pill-row">'+["téléphoner à","sourire à","plaire à","parler à","répondre à","obéir à","désobéir à","mentir à","ressembler à","faire confiance à","nuire à","rendre visite à"].map(function(v){return '<span class="pill coi">'+v+' qqn</span>';}).join("")+'</div>'+
      '<p class="ex">Djadja sourit à Aya.<span class="arrow">→</span><b class="c-coi">Djadja lui sourit.</b></p>'+
      '<p class="ex">Ses mensonges ne plaisent pas à Aya.<span class="arrow">→</span><b class="c-coi">Ils ne lui plaisent pas.</b></p>'+
      '<p class="ex">Elle ne fait plus confiance à ses voisins.<span class="arrow">→</span><b class="c-coi">Elle ne leur fait plus confiance.</b></p>'+
      '<p class="tip">Avec <b>plaire</b>, le sujet est la chose qui plaît : Ce film plaît à Aya → Ce film lui plaît.</p>'},
    {t:"quiz",kind:"intrus",q:"Quel verbe de cette liste n'utilise pas « à » ?",help:"Cherchez le verbe qui prend un COD.",o:["parler","répondre","ressembler","remercier","faire confiance","nuire"],r:3,
     good:"Bravo ! On remercie quelqu'un : « Je la remercie ».",bad:"L'intrus est « remercier » : on remercie quelqu'un, sans « à ». → Je la remercie."},
    {t:"quiz",kind:"qcm",q:"Ce film plaît à Aya. → Ce film ___ plaît.",o:["la","lui","le"],r:1,
     good:"Exact ! Plaire à quelqu'un → lui.",bad:"On dit « plaire à quelqu'un » : c'est un COI. → Ce film lui plaît."},
    {t:"quiz",kind:"vf",q:"Qu'en dites-vous ? « Djadja la sourit dans la rue. »",o:["La phrase est correcte.","La phrase est incorrecte."],r:1,
     good:"Bien vu ! Sourire à quelqu'un → Djadja lui sourit.",bad:"On sourit à quelqu'un (COI). → Djadja lui sourit dans la rue."},

    {t:"lesson",eyebrow:"Leçon 4",title:"Attention ! Même idée, construction différente",html:
      '<p class="lead">Ces verbes prennent un <span class="c-cod">COD</span> : appeler, aider, remercier, écouter, attendre, croire, prévenir, inviter, féliciter, soutenir, ignorer.</p>'+
      '<div class="tablewrap"><table class="rules"><thead><tr><th>COD → le, la, les</th><th>COI → lui, leur</th></tr></thead><tbody>'+
      '<tr><td>appeler qqn → <b class="c-cod">Appelle-la !</b></td><td>téléphoner à qqn → <b class="c-coi">Téléphone-lui !</b></td></tr>'+
      '<tr><td>remercier qqn → <b class="c-cod">Remercie-la !</b></td><td>dire merci à qqn → <b class="c-coi">Dis-lui merci !</b></td></tr>'+
      '<tr><td>écouter qqn → <b class="c-cod">Écoute-le !</b></td><td>obéir à qqn → <b class="c-coi">Obéis-lui !</b></td></tr>'+
      '<tr><td>aider qqn → <b class="c-cod">Aide-le !</b></td><td>rendre service à qqn → <b class="c-coi">Rends-lui service !</b></td></tr>'+
      '</tbody></table></div>'},
    {t:"quiz",kind:"intrus",q:"Cette fois, quel verbe de la liste utilise « à » ?",help:"Cinq verbes prennent un COD. Un seul prend « à ».",o:["appeler","aider","inviter","téléphoner","prévenir","féliciter"],r:3,
     good:"Oui ! Téléphoner à quelqu'un → Téléphone-lui !",bad:"C'est « téléphoner » : on téléphone à quelqu'un. Les autres prennent un COD."},
    {t:"quiz",kind:"qcm",q:"Ta mère t'a appelée trois fois. ___ !",o:["Rappelle-lui","Rappelle-la","La rappelle"],r:1,
     good:"Parfait ! Rappeler quelqu'un (COD) : Rappelle-la !",bad:"Rappeler quelqu'un = COD, et à l'affirmatif le pronom va après le verbe : Rappelle-la !"},
    {t:"quiz",kind:"qcm",q:"Ses amies ___ aident beaucoup.",o:["l'","lui","leur"],r:0,
     good:"Exact ! Aider quelqu'un → Ses amies l'aident.",bad:"Aider quelqu'un est un COD : Ses amies l'aident."},

    {t:"lesson",eyebrow:"Leçon 5",title:"Encore un piège : à lui, à elle, à eux",html:
      '<p class="lead">Avec ces verbes, on garde « à » et on utilise un <b>pronom tonique</b> pour une personne :</p>'+
      '<div class="pill-row">'+["penser à","s'intéresser à","faire attention à","s'habituer à","tenir à","s'adresser à"].map(function(v){return '<span class="pill de">'+v+' qqn</span>';}).join("")+'</div>'+
      '<p class="ex">Aya pense encore à Djadja.<span class="arrow">→</span><b>Elle pense encore à lui.</b></p>'+
      '<p class="ex">Elle tient à ses amies.<span class="arrow">→</span><b>Elle tient à elles.</b></p>'+
      '<p class="tip">On ne dit pas « je lui pense ». Pour une chose : <b>j\'y pense</b>.</p>'},
    {t:"quiz",kind:"qcm",q:"Tu penses encore à Djadja ? Ne pense plus ___ !",o:["lui","à lui","le"],r:1,
     good:"Bravo ! Penser à quelqu'un → à lui.",bad:"Avec « penser à », on garde « à » + pronom tonique : Ne pense plus à lui !"},
    {t:"quiz",kind:"vf",q:"Qu'en dites-vous ? « Elle s'intéresse à lui. »",o:["La phrase est correcte.","La phrase est incorrecte."],r:0,
     good:"Oui ! S'intéresser à quelqu'un → à lui.",bad:"La phrase est correcte : avec « s'intéresser à », on dit « à lui »."},
    {t:"quiz",kind:"intrus",q:"Quel verbe utilise « lui » et non « à lui » ?",help:"Cinq verbes gardent « à lui ». Un seul prend « lui ».",o:["penser","s'intéresser","tenir","téléphoner","faire attention","s'habituer"],r:3,
     good:"Exact ! Je lui téléphone, mais je pense à lui.",bad:"C'est « téléphoner » : je lui téléphone. Avec les autres : à lui."},

    {t:"lesson",eyebrow:"Leçon 6",title:"L'impératif avec les pronoms",html:
      '<div class="two"><div class="panel"><h4>Affirmatif : APRÈS le verbe, avec trait d\'union</h4>'+
      '<p class="ex"><b>Ignore-le ! Réponds-lui !</b></p><p class="ex"><b>Écoute-moi ! Calme-toi !</b></p><p class="ex"><b>Dis-le-lui ! Montre-les-leur !</b></p>'+
      '<p>me, te → <b>moi, toi</b> · ordre : verbe – le/la/les – lui/leur</p></div>'+
      '<div class="panel"><h4>Négatif : AVANT le verbe</h4>'+
      '<p class="ex"><b>Ne l\'ignore pas ! Ne lui réponds pas !</b></p><p class="ex"><b>Ne m\'écoute pas ! Ne t\'inquiète pas !</b></p><p class="ex"><b>Ne le lui dis pas !</b></p>'+
      '<p>ordre : ne – me/te – le/la/les – lui/leur – verbe – pas</p></div></div>'},
    {t:"quiz",kind:"qcm",q:"Djadja t'écrit un message. ___ !",o:["Ne lui réponds pas","Ne réponds-lui pas","Lui ne réponds pas"],r:0,
     good:"Parfait ! Au négatif, le pronom va avant le verbe.",bad:"Au négatif : ne + pronom + verbe + pas. → Ne lui réponds pas !"},
    {t:"quiz",kind:"qcm",q:"Tu es très énervée. ___ !",o:["Calme-te","Calme-toi","Te calme"],r:1,
     good:"Bravo ! À l'affirmatif, te devient toi.",bad:"À l'affirmatif, « te » devient « toi » : Calme-toi !"},
    {t:"quiz",kind:"qcm",q:"Tu as des captures d'écran. Montre-les à la police ! → ___",o:["Montre-les-lui !","Montre-lui-les !","Les lui montre !"],r:0,
     good:"Excellent ! Verbe – COD – COI : Montre-les-lui !",bad:"Ordre à l'affirmatif : verbe – le/la/les – lui/leur. → Montre-les-lui !"}
  ]};

  var MOD_DE={id:"de",tag:"Parcours 2",title:"Avec « de » : en !",desc:"Les verbes avec « de », le pronom en, de lui / d'elle et l'impératif.",color:"#8a6a0c",steps:[
    {t:"lesson",eyebrow:"Leçon 1",title:"Les verbes qui se construisent avec « de »",html:
      '<div class="pill-row">'+["parler de","discuter de","avoir besoin de","avoir envie de","avoir peur de","avoir honte de","se souvenir de","s'occuper de","rêver de","se moquer de","profiter de","se plaindre de","se méfier de","être fier de","être content de","s'excuser de"].map(function(v){return '<span class="pill de">'+v+'</span>';}).join("")+'</div>'+
      '<p class="ex">Aya parle <span class="c-de">de la rumeur</span>.</p><p class="ex">Elle a besoin <span class="c-de">de calme</span>.</p><p class="ex">Elle a envie <span class="c-de">de partir</span> en vacances.</p>'},
    {t:"quiz",kind:"intrus",q:"Quel verbe de cette liste n'utilise pas « de » ?",help:"Cinq verbes se construisent avec « de ». Trouvez l'intrus !",o:["parler","rêver","se souvenir","regarder","avoir peur","profiter"],r:3,
     good:"Bravo ! On regarde quelque chose, sans « de ».",bad:"L'intrus est « regarder » : on regarde quelque chose (COD)."},
    {t:"quiz",kind:"vf",q:"Qu'en dites-vous ? « J'ai besoin ton aide. »",o:["La phrase est correcte.","La phrase est incorrecte."],r:1,
     good:"Exact ! Avoir besoin DE : J'ai besoin de ton aide.",bad:"Il manque « de » : J'ai besoin de ton aide."},
    {t:"quiz",kind:"intrus",q:"Encore un intrus : quel verbe n'utilise pas « de » ?",help:"Attention aux faux amis…",o:["s'occuper","avoir envie","se moquer","attendre","se plaindre","discuter"],r:3,
     good:"Oui ! On attend quelqu'un ou quelque chose, sans « de ».",bad:"L'intrus est « attendre » : on attend quelque chose (COD)."},

    {t:"lesson",eyebrow:"Leçon 2",title:"La règle : de + chose ou idée → EN",html:
      '<p class="lead">Tout ce qui est introduit par <b>de</b> (une chose, une idée, un infinitif) devient <b class="c-de">en</b>.</p>'+
      '<p class="ex">Aya parle de la rumeur.<span class="arrow">→</span><b class="c-de">Elle en parle.</b></p>'+
      '<p class="ex">Elle a peur des réseaux sociaux.<span class="arrow">→</span><b class="c-de">Elle en a peur.</b></p>'+
      '<p class="ex">Elle a envie de partir.<span class="arrow">→</span><b class="c-de">Elle en a envie.</b></p>'+
      '<p class="ex">Djadja raconte beaucoup de mensonges.<span class="arrow">→</span><b class="c-de">Il en raconte beaucoup.</b></p>'+
      '<div class="tablewrap"><table class="rules"><thead><tr><th>Où placer « en » ?</th><th>Exemple</th></tr></thead><tbody>'+
      '<tr><td>avant le verbe conjugué</td><td>Elle <b>en</b> parle.</td></tr>'+
      '<tr><td>avant l\'auxiliaire au passé composé</td><td>Elle <b>en</b> a parlé.</td></tr>'+
      '<tr><td>avant l\'infinitif</td><td>Elle va <b>en</b> parler.</td></tr>'+
      '<tr><td>au négatif</td><td>Elle n\'<b>en</b> parle pas.</td></tr></tbody></table></div>'},
    {t:"quiz",kind:"qcm",q:"Aya a besoin de calme. → Aya ___ a besoin.",o:["en","le","y"],r:0,
     good:"Bravo ! Avoir besoin de quelque chose → en.",bad:"De + chose → en : Aya en a besoin."},
    {t:"quiz",kind:"qcm",q:"Djadja raconte beaucoup de mensonges. → Il ___ raconte beaucoup.",o:["les","en","leur"],r:1,
     good:"Exact ! Avec une quantité (beaucoup de…), on utilise en.",bad:"Beaucoup de mensonges → en : Il en raconte beaucoup."},
    {t:"quiz",kind:"qcm",q:"Elle va parler de la rumeur. → Elle ___.",o:["en va parler","va en parler","va parler en"],r:1,
     good:"Parfait ! « en » se place devant l'infinitif.",bad:"Avec un infinitif, « en » va devant l'infinitif : Elle va en parler."},

    {t:"lesson",eyebrow:"Leçon 3",title:"Et pour une personne ? de lui, d'elle",html:
      '<p class="lead">Pour une <b>personne</b>, on garde « de » + un pronom tonique :</p>'+
      '<div class="pill-row"><span class="pill">de moi</span><span class="pill">de toi</span><span class="pill">de lui</span><span class="pill">d\'elle</span><span class="pill">de nous</span><span class="pill">de vous</span><span class="pill">d\'eux</span><span class="pill">d\'elles</span></div>'+
      '<p class="ex">Aya parle de Djadja.<span class="arrow">→</span><b>Elle parle de lui.</b></p>'+
      '<p class="ex">Elle se méfie de ses voisins.<span class="arrow">→</span><b>Elle se méfie d\'eux.</b></p>'+
      '<p class="ex">Elle est fière de ses amies.<span class="arrow">→</span><b>Elle est fière d\'elles.</b></p>'+
      '<p class="tip">À l\'oral, on entend parfois « en » pour une personne. À l\'écrit et dans un registre standard, préférez <b>de lui, d\'elle</b>.</p>'},
    {t:"quiz",kind:"qcm",q:"Aya se moque de Djadja. → Aya se moque ___.",o:["en","de lui","lui"],r:1,
     good:"Bravo ! Pour une personne : de lui.",bad:"Djadja est une personne : on dit « de lui ». → Aya se moque de lui."},
    {t:"quiz",kind:"qcm",q:"Tu te souviens de ce concert ? → Oui, je ___ souviens.",o:["m'en","me de lui","m'y"],r:0,
     good:"Exact ! Un concert est une chose : je m'en souviens.",bad:"Se souvenir de + chose → en : je m'en souviens."},
    {t:"quiz",kind:"vf",q:"Qu'en dites-vous ? « Il parle de son travail. → Il en parle. »",o:["La transformation est correcte.","La transformation est incorrecte."],r:0,
     good:"Oui ! Son travail est une chose : il en parle.",bad:"La transformation est correcte : de + chose → en. Il en parle."},

    {t:"lesson",eyebrow:"Leçon 4",title:"L'impératif avec « en »",html:
      '<div class="two"><div class="panel de"><h4>Affirmatif</h4>'+
      '<p class="ex"><b>Parles-en !</b> <b>Profites-en !</b> <b>Prends-en !</b></p>'+
      '<p>Le <b>s</b> revient devant « en » pour les verbes en -er : parle → parle<b>s</b>-en. Même chose avec « y » : va<b>s</b>-y !</p>'+
      '<p class="ex">Verbes pronominaux : toi + en → <b>t\'en</b></p>'+
      '<p class="ex"><b>Occupe-t\'en ! Souviens-t\'en ! Va-t\'en !</b></p></div>'+
      '<div class="panel"><h4>Négatif</h4>'+
      '<p class="ex"><b>N\'en parle pas !</b> <b>N\'en profite pas !</b></p>'+
      '<p class="ex"><b>Ne t\'en occupe pas !</b> <b>Ne t\'en va pas !</b></p>'+
      '<p>Avec un COI : <b>Parle-lui-en !</b> · <b>Ne lui en parle pas !</b></p></div></div>'},
    {t:"quiz",kind:"qcm",q:"Tu as un problème ? ___ à tes amies !",o:["Parle-en","Parles-en","En parle"],r:1,
     good:"Parfait ! Le s revient devant en : Parles-en !",bad:"Devant « en », le s revient : Parles-en à tes amies !"},
    {t:"quiz",kind:"qcm",q:"La rumeur ? ___ !",o:["N'en parle pas","Ne parles-en pas","Ne parle pas en"],r:0,
     good:"Bravo ! Au négatif : n'en + verbe + pas.",bad:"Au négatif, « en » va avant le verbe : N'en parle pas !"},
    {t:"quiz",kind:"qcm",q:"Ce problème ? Occupe-toi de ce problème ! → ___",o:["Occupe-toi-en !","Occupe-t'en !","T'en occupe !"],r:1,
     good:"Excellent ! toi + en → t'en : Occupe-t'en !",bad:"Toi + en devient t'en : Occupe-t'en !"},

    {t:"lesson",eyebrow:"Bilan",title:"À ou DE : le tableau récapitulatif",html:
      '<div class="tablewrap"><table class="rules"><thead><tr><th>Construction</th><th>Pronom</th><th>Exemple</th></tr></thead><tbody>'+
      '<tr><td>verbe + quelqu\'un / quelque chose</td><td><b class="c-cod">le, la, les</b></td><td>Je l\'appelle.</td></tr>'+
      '<tr><td>à + personne</td><td><b class="c-coi">lui, leur</b></td><td>Je lui téléphone.</td></tr>'+
      '<tr><td>à + personne (penser à, tenir à…)</td><td><b>à lui, à elle</b></td><td>Je pense à lui.</td></tr>'+
      '<tr><td>à + chose ou lieu</td><td><b>y</b></td><td>J\'y pense. J\'y vais.</td></tr>'+
      '<tr><td>de + chose, idée, quantité</td><td><b class="c-de">en</b></td><td>J\'en parle. J\'en ai besoin.</td></tr>'+
      '<tr><td>de + personne</td><td><b>de lui, d\'elle</b></td><td>Je parle de lui.</td></tr></tbody></table></div>'},
    {t:"quiz",kind:"qcm",q:"Tu penses à ton examen ? → Oui, j'___ pense.",o:["y","en","lui"],r:0,
     good:"Bravo ! À + chose → y.",bad:"Penser à + chose → y : J'y pense."},
    {t:"quiz",kind:"qcm",q:"Tu parles de ton examen à ta mère ? → Oui, je ___ parle.",o:["lui en","en lui","la en"],r:0,
     good:"Parfait ! lui (à ta mère) + en (de l'examen).",bad:"À ta mère → lui ; de ton examen → en. Ordre : lui avant en. → Je lui en parle."},
    {t:"quiz",kind:"qcm",q:"C'est les vacances ! ___ !",o:["Profites-en","Profite-en","En profite"],r:0,
     good:"Excellent ! Profites-en : le s revient devant en.",bad:"Devant « en », le s revient : Profites-en !"}
  ]};

  var PAWN='<svg viewBox="0 0 24 32" aria-hidden="true"><circle cx="12" cy="7" r="5.5" fill="#4253d6" stroke="#102a43" stroke-width="1.5"/><path d="M8.5 12.5h7l2.6 11.5H5.9z" fill="#4253d6" stroke="#102a43" stroke-width="1.5" stroke-linejoin="round"/><rect x="3.5" y="24" width="17" height="5.5" rx="2.5" fill="#4253d6" stroke="#102a43" stroke-width="1.5"/><circle cx="10" cy="5.5" r="1.6" fill="#fff" opacity=".7"/></svg>';
  var BUBBLES='<svg viewBox="0 0 64 52" aria-hidden="true"><path d="M8 4h30a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H20l-8 8v-8H8a6 6 0 0 1-6-6V10a6 6 0 0 1 6-6z" fill="#f26b5e"/><circle cx="14" cy="17" r="2.6" fill="#fff"/><circle cx="23" cy="17" r="2.6" fill="#fff"/><circle cx="32" cy="17" r="2.6" fill="#fff"/><path d="M30 22h26a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6h-2v6l-7-6H30a6 6 0 0 1-6-6V28a6 6 0 0 1 6-6z" fill="#f7a93b"/><rect x="31" y="29" width="22" height="3" rx="1.5" fill="#fff"/><rect x="31" y="36" width="15" height="3" rx="1.5" fill="#fff"/></svg>';

  function gload(){try{var x=JSON.parse(localStorage.getItem(GKEY)||"{}");gs.done=x.done||{};gs.rev=x.rev||{};}catch(e){}}
  function gsave(){try{localStorage.setItem(GKEY,JSON.stringify({done:gs.done,rev:gs.rev}));}catch(e){}}
  function gcount(){return Object.keys(gs.done).length;}
  function pk(s){return esc(s).replace(/\{([vgrb])\|([^}]*)\}/g,'<span class="pk-$1">$2</span>');}
  function plain(s){return s.replace(/\{[vgrb]\|([^}]*)\}/g,"$1");}
  function pips(n){var on={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n]||[],h="";for(var i=0;i<9;i++)h+='<i'+(on.indexOf(i)>-1?' class="on"':'')+'></i>';return h;}
  function wtxt(w){return w[1]?'<span class="pk-'+w[1]+'">'+esc(w[0])+'</span>':esc(w[0]);}
  function key(r,c){return r+"-"+c;}
  function typeName(t){return t==="i"?"Impératif":t==="m"?"Méli-mélo":"Question";}

  var F={
    f1:'<div class="chain mini"><span class="slot v">me · te · se · nous · vous</span><span class="arr">→</span><span class="slot g">le · la · l\' · les</span><span class="arr">→</span><span class="slot r">lui · leur</span><span class="arr">+ verbe</span></div>',
    f2:'<div class="chain mini"><span class="slot mix"><span class="pk-v">m\' t\' s\' nous vous</span> · <span class="pk-g">l\' les</span> · <span class="pk-r">lui leur</span></span><span class="arr">→</span><span class="slot b">y</span><span class="arr">→</span><span class="slot b">en</span></div>',
    f3:'<div class="chain mini"><span class="slot verb">verbe</span><span class="arr">–</span><span class="slot g">le · la · les</span><span class="arr">–</span><span class="slot mix"><span class="pk-v">moi · toi · nous · vous</span> · <span class="pk-r">lui · leur</span></span><span class="arr">–</span><span class="slot b">y</span><span class="arr">–</span><span class="slot b">en</span></div>'
  };
  var FLAB={f1:"Formule 1 · ordre devant le verbe",f2:"Formule 2 · y et en à la fin",f3:"Formule 3 · impératif affirmatif"};

  function formulas(){
    return '<details class="gform" open><summary>Les formules de combinaison des pronoms</summary><div class="fgrid">'+
      '<div class="fbox"><h4>Formule 1 · devant le verbe</h4><p class="fsub">Phrases affirmatives, négatives, questions et impératif négatif</p>'+
        '<div class="circles"><div class="circ v"><span>me</span><span>te</span><span>se</span><span>nous</span><span>vous</span></div><div class="circ g"><span>la</span><span>le</span><span>l\'</span><span>les</span></div><div class="circ r"><span>lui</span><span>leur</span></div></div>'+
        '<p class="fex">Je '+pk("{v|te} {g|la}")+' prête. · Elle '+pk("{g|la} {r|leur}")+' raconte. · Ne '+pk("{v|me} {g|la}")+' dis pas !</p>'+
        '<p class="fnote">me, te, se, nous, vous ne se combinent jamais avec lui, leur.</p></div>'+
      '<div class="fbox"><h4>Formule 2 · y et en toujours à la fin</h4><p class="fsub">Tous les autres pronoms se placent avant y et en ; y se place avant en.</p>'+
        '<div class="f2wrap"><div class="vpill"><span class="pk-v">m\'</span><span class="pk-v">t\'</span><span class="pk-v">s\'</span><span class="pk-g">l\'</span><span class="pk-r">lui</span><span class="pk-v">nous</span><span class="pk-v">vous</span><span class="pk-g">les</span><span class="pk-r">leur</span></div><span class="arr" aria-hidden="true">→</span><div class="bubble">y / en</div></div>'+
        '<p class="fex">Je '+pk("{v|m'}{b|en}")+' souviens. · Elle '+pk("{r|leur} {b|en}")+' a acheté. · Il '+pk("{b|y} {b|en}")+' a.</p></div>'+
      '<div class="fbox wide"><h4>Formule 3 · impératif affirmatif : après le verbe, avec des traits d\'union</h4><p class="fsub">Le pronom COD (le, la, les) d\'abord, puis la personne, puis y, puis en.</p>'+
        '<div class="chain"><span class="slot verb">verbe</span><span class="arr">–</span><span class="slot g">le · la · les</span><span class="arr">–</span><span class="slot mix"><span class="pk-v">moi · toi · nous · vous</span> · <span class="pk-r">lui · leur</span></span><span class="arr">–</span><span class="slot b">y</span><span class="arr">–</span><span class="slot b">en</span></div>'+
        '<p class="fex">'+pk("Donne-{g|les}-{r|lui} !")+' · '+pk("Dis-{g|la}-{v|moi} !")+' · '+pk("Offrez-{r|leur}-{b|en} !")+' · '+pk("Donne-{v|m'}{b|en} !")+'</p>'+
        '<p class="fnote">me, te deviennent moi, toi (mais m\'en, t\'en). Au négatif, on revient à la formule 1 : '+pk("Ne {v|me} {g|la} dis pas !")+'</p></div>'+
      '</div></details>';
  }

  function cellHTML(r,c){
    var x=G[r][c],inner;
    if(x.t==="i")inner='<span class="glab">Impératif, remplacez :</span><span class="gtxt">'+pk(x.p)+'</span><span class="gicon" aria-hidden="true">!</span>';
    else if(x.t==="m")inner='<span class="glab mm">Méli-mélo :</span><span class="gtxt">'+x.w.map(wtxt).join(" - ")+'</span><span class="gicon" aria-hidden="true">⇄</span>';
    else inner='<span class="gtxt">'+pk(x.p)+'</span><span class="gicon" aria-hidden="true">?</span>'+(x.pol==="+"?BPLUS:x.pol==="-"?BMINUS:"");
    var txt=x.t==="m"?x.w.map(function(w){return w[0];}).join(", "):plain(x.p);
    return '<button type="button" class="gcell '+x.t+'" data-r="'+r+'" data-c="'+c+'" aria-label="Ligne '+(r+1)+', colonne '+(c+1)+'. '+esc(typeName(x.t))+' : '+esc(txt)+'"><span class="gdone" aria-hidden="true">✓</span><span class="gpawn" aria-hidden="true">'+PAWN+'</span>'+inner+'</button>';
  }
  function boardHTML(){
    var h='<div class="gboard" id="gboard"><div class="gcell h gcorner">'+BUBBLES+'</div>';
    for(var c=0;c<6;c++)h+='<div class="gcell h" data-hc="'+c+'" aria-label="Dé 2 : '+(c+1)+'"><div class="mdie">'+pips(c+1)+'</div></div>';
    for(var r=0;r<6;r++){
      h+='<div class="gcell h" data-hr="'+r+'" aria-label="Dé 1 : '+(r+1)+'"><div class="mdie">'+pips(r+1)+'</div></div>';
      for(c=0;c<6;c++)h+=cellHTML(r,c);
    }
    return h+'</div>';
  }
  function trackHTML(){
    var n=gcount(),s="";
    for(var i=0;i<36;i++)s+='<span'+(i<n?' class="on"':'')+'></span>';
    return '<div class="ptrack"><div class="ptop"><span>Mon pion</span><span id="pcount">'+n+' / 36 cases réussies</span></div>'+
      '<div class="prail"><div class="pcells" id="pcells">'+s+'</div><div class="pawn" id="pawn" style="left:'+(n/36*100)+'%">'+PAWN+'</div></div>'+
      '<div class="pends"><span>Départ</span><span>Arrivée</span></div></div>';
  }
  function gstatus(){
    var n=gcount();
    document.getElementById("stepLabel").textContent="Jeu · doubles pronoms";
    document.getElementById("scoreLabel").textContent=n+" / 36";
    document.getElementById("fill").style.width=Math.round(n/36*100)+"%";
  }
  function refresh(){
    var n=gcount(),cells=document.querySelectorAll("#pcells span");
    for(var i=0;i<cells.length;i++)cells[i].className=i<n?"on":"";
    var pw=document.getElementById("pawn");if(pw)pw.style.left=(n/36*100)+"%";
    var pc=document.getElementById("pcount");if(pc)pc.textContent=n+" / 36 cases réussies";
    document.querySelectorAll("#gboard [data-r]").forEach(function(b){
      var k=key(b.getAttribute("data-r"),b.getAttribute("data-c"));
      b.classList.toggle("done",!!gs.done[k]);
      b.classList.toggle("rev",!!gs.rev[k]&&!gs.done[k]);
      b.classList.toggle("sel",!!gs.cur&&k===key(gs.cur.r,gs.cur.c));
    });
    document.querySelectorAll("#gboard [data-hr]").forEach(function(h){h.classList.toggle("hl",!!gs.cur&&+h.getAttribute("data-hr")===gs.cur.r);});
    document.querySelectorAll("#gboard [data-hc]").forEach(function(h){h.classList.toggle("hl",!!gs.cur&&+h.getAttribute("data-hc")===gs.cur.c);});
    gstatus();
  }

  function game(){
    state.mod=null;gs.cur=null;
    render('<section class="screen active"><div class="card gamecard">'+
      '<p class="eyebrow" style="color:#4253d6">Activité 9 · Parcours 3 · Jeu</p>'+
      '<h2 class="gtitle">Les doubles pronoms en français</h2>'+
      formulas()+
      '<div class="gcons"><p><b>Lancez les dés.</b> Le dé 1 donne la ligne, le dé 2 donne la colonne.</p>'+
        '<p>a) Lisez à haute voix la question. Répondez <u>affirmativement</u> '+BPLUS.replace('class="gb"','class="ib"')+' ou <u>négativement</u> '+BMINUS.replace('class="gb"','class="ib"')+' à l\'oral avec les pronoms adéquats.</p>'+
        '<p>b) Ordonnez les éléments du <b class="pk-r">Méli-mélo</b> correctement ou remplacez les objets à l\'impératif par un pronom.</p>'+
        '<p>Vérifiez la réponse : si vous avez réussi, votre pion avance.</p></div>'+
      '<div class="gplay"><div class="dicebar">'+
        '<div class="diewrap"><span class="dielab">Dé 1 · ligne</span><div class="die" id="d1" aria-hidden="true">'+pips(1)+'</div></div>'+
        '<div class="diewrap"><span class="dielab">Dé 2 · colonne</span><div class="die" id="d2" aria-hidden="true">'+pips(1)+'</div></div>'+
        '<button class="btn rollbtn" type="button" id="roll">Lancer les dés</button></div>'+
        trackHTML()+'</div>'+
      '<div class="gpanel empty" id="gpanel" aria-live="polite"><p>Lancez les dés pour tirer une case, ou touchez une case du plateau.</p></div>'+
      boardHTML()+
      '<p class="glegend"><span><b>?</b> question</span><span><b>⇄</b> méli-mélo</span><span><b>!</b> impératif (en diagonale)</span><span>✓ case réussie</span><span>bordure en pointillés : à revoir</span></p>'+
      '<div class="gfoot"><button class="linkbtn" type="button" id="menu">← Menu</button><button class="btn ghost" type="button" id="greset">Recommencer le parcours</button></div>'+
      '</div></section>');
    document.getElementById("menu").addEventListener("click",home);
    document.getElementById("roll").addEventListener("click",roll);
    document.querySelectorAll("#gboard [data-r]").forEach(function(b){
      b.addEventListener("click",function(){openCell(+b.getAttribute("data-r"),+b.getAttribute("data-c"));});
    });
    var rs=document.getElementById("greset");
    rs.addEventListener("click",function(){
      if(!rs.dataset.armed){rs.dataset.armed="1";rs.textContent="Confirmer : tout effacer ?";setTimeout(function(){if(rs.dataset.armed){delete rs.dataset.armed;rs.textContent="Recommencer le parcours";}},4000);return;}
      delete rs.dataset.armed;gs.done={};gs.rev={};gs.cur=null;gsave();rs.textContent="Recommencer le parcours";
      var p=document.getElementById("gpanel");p.className="gpanel empty";p.innerHTML="<p>Parcours remis à zéro. Lancez les dés !</p>";refresh();
    });
    refresh();
  }

  function setDie(id,n){document.getElementById(id).innerHTML=pips(n);}
  function roll(){
    if(gs.rolling)return;
    gs.rolling=true;
    var btn=document.getElementById("roll");btn.disabled=true;
    var d1=document.getElementById("d1"),d2=document.getElementById("d2");
    var a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);
    function finish(){setDie("d1",a);setDie("d2",b);gs.rolling=false;btn.disabled=false;openCell(a-1,b-1);}
    if(reduce){finish();return;}
    [d1,d2].forEach(function(d){d.classList.remove("rolling");void d.offsetWidth;d.classList.add("rolling");});
    var iv=setInterval(function(){setDie("d1",1+Math.floor(Math.random()*6));setDie("d2",1+Math.floor(Math.random()*6));},80);
    setTimeout(function(){clearInterval(iv);finish();},720);
  }

  function openCell(r,c){
    gs.cur={r:r,c:c};
    var x=G[r][c],k=key(r,c),p=document.getElementById("gpanel");
    var h='<div class="ghead"><span class="gpos">Dé 1 : '+(r+1)+' · Dé 2 : '+(c+1)+'</span><span class="gtag '+x.t+'">'+typeName(x.t)+'</span></div>';
    if(gs.done[k])h+='<p class="gdonenote">✓ Case déjà réussie. Relancez les dés, ou refaites-la pour vous entraîner.</p>';
    if(x.t==="i")h+='<p class="gsmall">Impératif, remplacez :</p><p class="gprompt">'+pk(x.p)+'</p><p class="gconsigne">Remplacez les compléments par des pronoms et dites la phrase à voix haute.</p>';
    else if(x.t==="q"){
      h+='<p class="gprompt">'+pk(x.p)+'</p>';
      h+='<p class="gconsigne">'+(x.pol==="+"?'Répondez <b>affirmativement</b> '+BPLUS.replace('class="gb"','class="ib"'):x.pol==="-"?'Répondez <b>négativement</b> '+BMINUS.replace('class="gb"','class="ib"'):'Répondez avec <b>un nombre</b>')+' à l\'oral, avec les pronoms adéquats.</p>';
    }else{
      h+='<p class="gsmall">Méli-mélo :</p><p class="gconsigne">Touchez les mots dans le bon ordre pour reconstruire la phrase.</p>'+
        '<div class="mm-pool" id="mmpool">'+x.w.map(function(w,i){return '<button type="button" class="chip" data-i="'+i+'">'+wtxt(w)+'</button>';}).join("")+'</div>'+
        '<p class="mm-lab">Votre phrase :</p><div class="mm-line" id="mmline"></div>'+
        '<div class="mm-act"><button class="btn ghost" type="button" id="mmcheck" disabled>Vérifier</button><button class="linkbtn" type="button" id="mmclear">Effacer</button></div>'+
        '<div class="feedback" id="mmfb"></div>';
    }
    h+='<div class="greveal" id="grev" hidden><p class="glabel">Réponse possible</p><p class="gans">'+pk(x.a)+'</p>'+
      (x.alt?'<p class="galt"><b>'+esc(x.alt[0])+'</b> '+pk(x.alt[1])+'</p>':'')+
      (x.n?'<p class="gnote">'+pk(x.n)+'</p>':'')+
      x.f.map(function(f){return '<p class="fmlab">'+FLAB[f]+'</p>'+F[f];}).join("")+'</div>';
    h+='<div class="nav"><button class="btn ghost" type="button" id="gshow">Voir la réponse</button>'+
      '<div class="gjudge" id="gjudge" hidden><button class="btn" type="button" id="gok">✓ Réussi : mon pion avance</button><button class="btn ghost" type="button" id="gko">À revoir</button></div>'+
      '<button class="linkbtn" type="button" id="groll2">Relancer les dés</button></div><p class="gmsg" id="gmsg" aria-live="polite"></p>';
    p.className="gpanel";p.innerHTML=h;typo(p);
    document.getElementById("gshow").addEventListener("click",reveal);
    document.getElementById("gok").addEventListener("click",function(){judge(true);});
    document.getElementById("gko").addEventListener("click",function(){judge(false);});
    document.getElementById("groll2").addEventListener("click",function(){
      document.querySelector(".gplay").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});roll();
    });
    if(x.t==="m")meli(x);
    refresh();
    setTimeout(function(){p.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});},60);
  }

  function reveal(){
    var rv=document.getElementById("grev");if(!rv.hidden)return;
    rv.hidden=false;
    document.getElementById("gshow").hidden=true;
    var k=key(gs.cur.r,gs.cur.c);
    if(!gs.done[k])document.getElementById("gjudge").hidden=false;
    setTimeout(function(){rv.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"});},80);
  }

  function judge(ok){
    var k=key(gs.cur.r,gs.cur.c),msg=document.getElementById("gmsg");
    document.getElementById("gjudge").hidden=true;
    if(ok){
      gs.done[k]=1;delete gs.rev[k];gsave();refresh();
      var n=gcount();
      if(n>=36){msg.textContent="Bravo ! Votre pion est arrivé : 36 cases sur 36. Vous maîtrisez les doubles pronoms !";confetti(null,240);popup("Arrivée !","ok");}
      else{msg.textContent="Votre pion avance : "+n+" / 36. Relancez les dés !";confetti(document.getElementById("pawn"),60);popup("Bravo !","ok");}
    }else{
      gs.rev[k]=1;gsave();refresh();
      msg.textContent="Case marquée « à revoir ». Relisez la formule, puis réessayez plus tard.";
    }
    typo(msg);
  }

  function meli(x){
    var picked=[],pool=document.getElementById("mmpool"),line=document.getElementById("mmline"),chk=document.getElementById("mmcheck"),fb=document.getElementById("mmfb");
    function draw(){
      line.innerHTML=picked.map(function(i,pos){return '<button type="button" class="chip" data-p="'+pos+'" aria-label="Retirer '+esc(x.w[i][0])+'">'+wtxt(x.w[i])+'</button>';}).join("");
      pool.querySelectorAll(".chip").forEach(function(b){b.disabled=picked.indexOf(+b.getAttribute("data-i"))>-1;});
      chk.disabled=picked.length!==x.w.length;
      line.querySelectorAll(".chip").forEach(function(b){b.addEventListener("click",function(){picked.splice(+b.getAttribute("data-p"),1);fb.className="feedback";draw();});});
    }
    pool.querySelectorAll(".chip").forEach(function(b){b.addEventListener("click",function(){var i=+b.getAttribute("data-i");if(picked.indexOf(i)<0){picked.push(i);draw();}});});
    document.getElementById("mmclear").addEventListener("click",function(){picked=[];fb.className="feedback";draw();});
    chk.addEventListener("click",function(){
      var good=picked.join(",")===x.sol.join(",");
      if(good){fb.className="feedback show good";fb.textContent="✓ Bravo, la phrase est bien construite !";reveal();}
      else{fb.className="feedback show";fb.textContent="✗ Pas encore. Regardez l'ordre des pronoms dans les formules, puis réessayez.";oops(document.getElementById("gpanel"));}
      typo(fb);
    });
    draw();
  }


  gload();
  home();
})();
</script>
</body>
</html>
